<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
      <animate attributeName="y1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (transparent center for project screenshot) -->
  <rect x="4" y="4" width="312" height="172" rx="10" fill="#0a0a0f" fill-opacity="0.3"/>

  <!-- Static border base -->
  <rect x="4" y="4" width="312" height="172" rx="10" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Animated horizontal glow - top -->
  <line x1="14" y1="4" x2="306" y2="4" stroke="url(#glowGrad1)" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Animated horizontal glow - bottom -->
  <line x1="14" y1="176" x2="306" y2="176" stroke="url(#glowGrad1)" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)">
    <animate attributeName="stroke-opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </line>

  <!-- Animated vertical glow - left -->
  <line x1="4" y1="14" x2="4" y2="166" stroke="url(#glowGrad2)" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Animated vertical glow - right -->
  <line x1="316" y1="14" x2="316" y2="166" stroke="url(#glowGrad2)" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)">
    <animate attributeName="stroke-opacity" values="0.6;0.3;0.6" dur="2.5s" repeatCount="indefinite" begin="1s"/>
  </line>

  <!-- Corner accents -->
  <circle cx="10" cy="10" r="3" fill="#00ffff" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="10" r="3" fill="#00ffff" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="10" cy="170" r="3" fill="#00ffff" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="310" cy="170" r="3" fill="#00ffff" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite" begin="1.8s"/>
  </circle>

  <!-- Breathing outer glow -->
  <rect x="4" y="4" width="312" height="172" rx="10" fill="none" stroke="#00d4ff" stroke-width="1" filter="url(#softGlow)">
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>