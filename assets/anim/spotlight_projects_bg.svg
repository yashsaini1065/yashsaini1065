<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spot" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
      <animate attributeName="cx" values="40%;60%;40%" dur="4.5s" repeatCount="indefinite"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="220" fill="#0B111B"/>
  <rect width="1200" height="220" fill="url(#spot)"/>
</svg>
