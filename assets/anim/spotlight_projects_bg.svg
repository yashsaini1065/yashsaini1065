<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spotlight1" cx="30%" cy="30%" r="40%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      <animate attributeName="cx" values="25%;35%;25%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="25%;35%;25%" dur="6s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="spotlight2" cx="70%" cy="60%" r="35%" fx="70%" fy="60%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
      <animate attributeName="cx" values="65%;75%;65%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="55%;65%;55%" dur="9s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="spotlight3" cx="50%" cy="80%" r="30%" fx="50%" fy="80%">
      <stop offset="0%" stop-color="#0099cc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0099cc" stop-opacity="0"/>
      <animate attributeName="cx" values="45%;55%;45%" dur="10s" repeatCount="indefinite"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="800" height="300" fill="#0a0a0f"/>

  <!-- Animated spotlight layers -->
  <rect width="800" height="300" fill="url(#spotlight1)"/>
  <rect width="800" height="300" fill="url(#spotlight2)"/>
  <rect width="800" height="300" fill="url(#spotlight3)"/>

  <!-- Subtle grid -->
  <g stroke="#00d4ff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
  </g>

  <!-- Corner accent particles -->
  <circle cx="50" cy="50" r="2" fill="#00d4ff">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="250" r="2" fill="#00ffff">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>