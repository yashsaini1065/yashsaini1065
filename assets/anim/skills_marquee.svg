<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">
  <defs>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="10%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="90%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="60" fill="#0a0a0f"/>

  <!-- Scrolling container - duplicated for seamless loop -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-700,0" dur="25s" repeatCount="indefinite"/>

    <!-- First set of skills -->
    <g fill="#00d4ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
      <!-- JavaScript -->
      <g transform="translate(20, 30)">
        <rect x="-8" y="-12" width="85" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="35" y="4" text-anchor="middle">JavaScript</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(120, 30)">
        <rect x="-8" y="-12" width="85" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="35" y="4" text-anchor="middle">TypeScript</text>
      </g>
      <!-- React -->
      <g transform="translate(220, 30)">
        <rect x="-8" y="-12" width="65" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="25" y="4" text-anchor="middle">React</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(300, 30)">
        <rect x="-8" y="-12" width="70" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="27" y="4" text-anchor="middle">Node.js</text>
      </g>
      <!-- Python -->
      <g transform="translate(385, 30)">
        <rect x="-8" y="-12" width="70" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="27" y="4" text-anchor="middle">Python</text>
      </g>
      <!-- AWS -->
      <g transform="translate(470, 30)">
        <rect x="-8" y="-12" width="55" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="20" y="4" text-anchor="middle">AWS</text>
      </g>
      <!-- Docker -->
      <g transform="translate(540, 30)">
        <rect x="-8" y="-12" width="65" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="25" y="4" text-anchor="middle">Docker</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(620, 30)">
        <rect x="-8" y="-12" width="85" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="35" y="4" text-anchor="middle">PostgreSQL</text>
      </g>
    </g>

    <!-- Second set (duplicate for seamless loop) -->
    <g fill="#00d4ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" transform="translate(700, 0)">
      <!-- JavaScript -->
      <g transform="translate(20, 30)">
        <rect x="-8" y="-12" width="85" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="35" y="4" text-anchor="middle">JavaScript</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(120, 30)">
        <rect x="-8" y="-12" width="85" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="35" y="4" text-anchor="middle">TypeScript</text>
      </g>
      <!-- React -->
      <g transform="translate(220, 30)">
        <rect x="-8" y="-12" width="65" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="25" y="4" text-anchor="middle">React</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(300, 30)">
        <rect x="-8" y="-12" width="70" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="27" y="4" text-anchor="middle">Node.js</text>
      </g>
      <!-- Python -->
      <g transform="translate(385, 30)">
        <rect x="-8" y="-12" width="70" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="27" y="4" text-anchor="middle">Python</text>
      </g>
      <!-- AWS -->
      <g transform="translate(470, 30)">
        <rect x="-8" y="-12" width="55" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="20" y="4" text-anchor="middle">AWS</text>
      </g>
      <!-- Docker -->
      <g transform="translate(540, 30)">
        <rect x="-8" y="-12" width="65" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="25" y="4" text-anchor="middle">Docker</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(620, 30)">
        <rect x="-8" y="-12" width="85" height="24" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
        <text x="35" y="4" text-anchor="middle">PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- Fade edges -->
  <rect width="80" height="60" fill="url(#fadeLeft)"/>
  <rect x="720" width="80" height="60" fill="url(#fadeRight)"/>
</svg>