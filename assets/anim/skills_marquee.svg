<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1724"/>
      <stop offset="100%" stop-color="#0C2033"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4CC9FF"/>
    </linearGradient>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" dur="5s" values="0 0;-600 0" repeatCount="indefinite"/>

    <g transform="translate(0 0)">
      <rect x="30" y="48" width="160" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="110" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Enterprise</text>

      <rect x="210" y="48" width="140" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="280" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">APIs</text>

      <rect x="370" y="48" width="140" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="440" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Web</text>

      <rect x="530" y="48" width="160" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="610" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Mobile</text>

      <rect x="710" y="48" width="160" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="790" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Cloud</text>

      <rect x="890" y="48" width="180" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="980" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Databases</text>
    </g>

    <g transform="translate(600 0)">
      <rect x="30" y="48" width="160" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="110" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Enterprise</text>

      <rect x="210" y="48" width="140" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="280" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">APIs</text>

      <rect x="370" y="48" width="140" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="440" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Web</text>

      <rect x="530" y="48" width="160" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="610" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Mobile</text>

      <rect x="710" y="48" width="160" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="790" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Cloud</text>

      <rect x="890" y="48" width="180" height="44" rx="12" fill="url(#badge)" stroke="url(#stroke)" stroke-width="1"/>
      <text x="980" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D7F7FF">Databases</text>
    </g>
  </g>
</svg>
