<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0099cc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#00ccff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#waveGrad1)"/>

  <!-- Wave Layer 1 - Back -->
  <path fill="url(#waveGrad2)" opacity="0.6">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="
      M0,160 C150,140 300,180 400,160 C500,140 650,180 800,160 L800,200 L0,200 Z;
      M0,160 C150,180 300,140 400,160 C500,180 650,140 800,160 L800,200 L0,200 Z;
      M0,160 C150,140 300,180 400,160 C500,140 650,180 800,160 L800,200 L0,200 Z"/>
  </path>

  <!-- Wave Layer 2 - Middle -->
  <path fill="url(#waveGrad2)" opacity="0.4">
    <animate attributeName="d" dur="3.5s" repeatCount="indefinite" values="
      M0,170 C200,155 350,185 500,170 C650,155 750,185 800,170 L800,200 L0,200 Z;
      M0,170 C200,185 350,155 500,170 C650,185 750,155 800,170 L800,200 L0,200 Z;
      M0,170 C200,155 350,185 500,170 C650,155 750,185 800,170 L800,200 L0,200 Z"/>
  </path>

  <!-- Wave Layer 3 - Front -->
  <path fill="url(#waveGrad3)" opacity="0.5">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
      M0,180 C100,170 200,190 300,180 C400,170 500,190 600,180 C700,170 750,190 800,180 L800,200 L0,200 Z;
      M0,180 C100,190 200,170 300,180 C400,190 500,170 600,180 C700,190 750,170 800,180 L800,200 L0,200 Z;
      M0,180 C100,170 200,190 300,180 C400,170 500,190 600,180 C700,170 750,190 800,180 L800,200 L0,200 Z"/>
  </path>

  <!-- Twinkle Particles -->
  <circle cx="100" cy="40" r="1.5" fill="#00d4ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="70" r="1" fill="#00ffff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="0.8;1.5;0.8" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="450" cy="35" r="1.2" fill="#00d4ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="1;1.8;1" dur="2.8s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="600" cy="55" r="1" fill="#00ffff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="r" values="0.8;1.6;0.8" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="720" cy="80" r="1.3" fill="#00d4ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.25;0.75;0.25" dur="2.6s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="r" values="1;1.7;1" dur="2.6s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="180" cy="95" r="0.8" fill="#00ccff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="520" cy="90" r="0.9" fill="#00ffff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.9s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <!-- Subtle grid lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#00d4ff" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="0" y1="50" x2="800" y2="50" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="0.5"/>
  <line x1="0" y1="150" x2="800" y2="150" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="0.5"/>
</svg>