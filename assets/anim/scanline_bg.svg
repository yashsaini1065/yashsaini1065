<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="#0B111B"/>

  <g opacity="0.25">
    <rect x="0" y="0" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="22" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="44" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="66" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="88" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="110" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="132" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="154" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="176" width="1200" height="2" fill="#1A2A3D"/>
    <rect x="0" y="198" width="1200" height="2" fill="#1A2A3D"/>
  </g>

  <rect x="0" y="-40" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" dur="4s" values="-60;220" repeatCount="indefinite"/>
  </rect>
</svg>
