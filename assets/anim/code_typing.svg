<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect width="500" height="280" rx="10" fill="url(#termGrad)" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Header bar -->
  <rect width="500" height="30" rx="10" fill="url(#headerGrad)"/>
  <rect y="20" width="500" height="10" fill="url(#headerGrad)"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="250" y="19" text-anchor="middle" fill="#8892b0" font-family="monospace" font-size="12">skills.ts</text>

  <!-- Code content with typing animation -->
  <g font-family="'Fira Code', 'Consolas', monospace" font-size="11" filter="url(#termGlow)">
    <!-- Line 1 -->
    <text x="20" y="55" fill="#c792ea">const</text>
    <text x="60" y="55" fill="#82aaff">developer</text>
    <text x="130" y="55" fill="#89ddff">=</text>
    <text x="145" y="55" fill="#89ddff">{</text>

    <!-- Line 2 -->
    <text x="35" y="75" fill="#f78c6c">name</text>
    <text x="70" y="75" fill="#89ddff">:</text>
    <text x="80" y="75" fill="#c3e88d">"Yash Saini"</text>
    <text x="170" y="75" fill="#89ddff">,</text>

    <!-- Line 3 -->
    <text x="35" y="95" fill="#f78c6c">role</text>
    <text x="65" y="95" fill="#89ddff">:</text>
    <text x="75" y="95" fill="#c3e88d">"Full-Stack Engineer"</text>
    <text x="230" y="95" fill="#89ddff">,</text>

    <!-- Line 4 -->
    <text x="35" y="115" fill="#f78c6c">skills</text>
    <text x="75" y="115" fill="#89ddff">:</text>
    <text x="85" y="115" fill="#89ddff">[</text>

    <!-- Line 5 - Skills array with typing effect -->
    <g>
      <text x="50" y="135" fill="#c3e88d">"React"</text>
      <text x="100" y="135" fill="#89ddff">,</text>
      <text x="110" y="135" fill="#c3e88d">"Node.js"</text>
      <text x="175" y="135" fill="#89ddff">,</text>
      <text x="185" y="135" fill="#c3e88d">"TypeScript"</text>
      <text x="270" y="135" fill="#89ddff">,</text>
      <!-- Typing cursor -->
      <rect x="280" y="125" width="8" height="14" fill="#00d4ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Line 6 -->
    <text x="50" y="155" fill="#c3e88d">"Angular"</text>
    <text x="115" y="155" fill="#89ddff">,</text>
    <text x="125" y="155" fill="#c3e88d">".NET Core"</text>
    <text x="205" y="155" fill="#89ddff">,</text>
    <text x="215" y="155" fill="#c3e88d">"Python"</text>

    <!-- Line 7 -->
    <text x="35" y="175" fill="#89ddff">]</text>
    <text x="42" y="175" fill="#89ddff">,</text>

    <!-- Line 8 -->
    <text x="35" y="195" fill="#f78c6c">expertise</text>
    <text x="100" y="195" fill="#89ddff">:</text>
    <text x="110" y="195" fill="#89ddff">[</text>
    <text x="117" y="195" fill="#c3e88d">"CRM"</text>
    <text x="150" y="195" fill="#89ddff">,</text>
    <text x="160" y="195" fill="#c3e88d">"ERP"</text>
    <text x="193" y="195" fill="#89ddff">,</text>
    <text x="203" y="195" fill="#c3e88d">"MLM"</text>
    <text x="238" y="195" fill="#89ddff">]</text>
    <text x="245" y="195" fill="#89ddff">,</text>

    <!-- Line 9 -->
    <text x="35" y="215" fill="#f78c6c">available</text>
    <text x="100" y="215" fill="#89ddff">:</text>
    <text x="115" y="215" fill="#ff5370">true</text>

    <!-- Line 10 -->
    <text x="20" y="235" fill="#89ddff">};</text>

    <!-- Line 11 - Export -->
    <text x="20" y="260" fill="#c792ea">export</text>
    <text x="65" y="260" fill="#c792ea">default</text>
    <text x="120" y="260" fill="#82aaff">developer</text>
    <text x="190" y="260" fill="#89ddff">;</text>
  </g>

  <!-- Animated scan line -->
  <rect x="15" y="40" width="470" height="2" fill="#00d4ff" opacity="0.1">
    <animate attributeName="y" values="40;265;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Line numbers glow effect -->
  <rect x="0" y="40" width="3" height="230" fill="#00d4ff" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>