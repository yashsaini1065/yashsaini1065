<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- Outer pulse rings -->
  <circle cx="12" cy="12" r="6" fill="none" stroke="#00ff88" stroke-width="1" opacity="0">
    <animate attributeName="r" values="6;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="12" r="6" fill="none" stroke="#00ff88" stroke-width="1" opacity="0">
    <animate attributeName="r" values="6;12" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Main dot -->
  <circle cx="12" cy="12" r="5" fill="url(#dotGrad)" filter="url(#dotGlow)">
    <animate attributeName="r" values="5;5.5;5" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner highlight -->
  <circle cx="10" cy="10" r="1.5" fill="#ffffff" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>