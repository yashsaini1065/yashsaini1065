<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="hexGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0099cc" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hexGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <filter id="hexGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Hexagon path template (flat-top) -->
    <polygon id="hexShape" points="30,0 60,17.3 60,52 30,69.3 0,52 0,17.3"/>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="#0a0a0f"/>

  <!-- Row 1 -->
  <!-- Hex 1: Full-Stack -->
  <g transform="translate(70, 40)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="url(#hexStroke)" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Full-Stack</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Development</text>
  </g>

  <!-- Hex 2: API Design -->
  <g transform="translate(145, 40)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="url(#hexStroke)" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">REST API</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Design</text>
  </g>

  <!-- Hex 3: Database -->
  <g transform="translate(220, 40)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="url(#hexStroke)" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Database</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Architecture</text>
  </g>

  <!-- Hex 4: Mobile -->
  <g transform="translate(295, 40)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="url(#hexStroke)" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.9s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Mobile</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Apps</text>
  </g>

  <!-- Hex 5: Cloud -->
  <g transform="translate(370, 40)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="url(#hexStroke)" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1.2s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Cloud</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Services</text>
  </g>

  <!-- Hex 6: DevOps -->
  <g transform="translate(445, 40)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="url(#hexStroke)" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">DevOps</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">CI/CD</text>
  </g>

  <!-- Row 2 (offset) -->
  <!-- Hex 7: CRM -->
  <g transform="translate(107, 105)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="#ff6b6b" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.2s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#ff6b6b" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">CRM</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Systems</text>
  </g>

  <!-- Hex 8: ERP -->
  <g transform="translate(182, 105)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="#feca57" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#feca57" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">ERP</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Solutions</text>
  </g>

  <!-- Hex 9: MLM -->
  <g transform="translate(257, 105)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="#48dbfb" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.8s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#48dbfb" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">MLM</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Platform</text>
  </g>

  <!-- Hex 10: Security -->
  <g transform="translate(332, 105)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="#ff9ff3" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1.1s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#ff9ff3" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Security</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">OWASP</text>
  </g>

  <!-- Hex 11: Linux -->
  <g transform="translate(407, 105)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="#54a0ff" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1.4s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#54a0ff" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Linux</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Admin</text>
  </g>

  <!-- Row 3 -->
  <!-- Hex 12: React -->
  <g transform="translate(70, 170)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="#61DAFB" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.4s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#61DAFB" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">React</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Native</text>
  </g>

  <!-- Hex 13: Angular -->
  <g transform="translate(145, 170)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="#DD0031" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.7s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#DD0031" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Angular</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Ionic</text>
  </g>

  <!-- Hex 14: Node -->
  <g transform="translate(220, 170)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="#68A063" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#68A063" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Node.js</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Express</text>
  </g>

  <!-- Hex 15: .NET -->
  <g transform="translate(295, 170)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="#512BD4" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1.3s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#512BD4" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">.NET</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Core</text>
  </g>

  <!-- Hex 16: Python -->
  <g transform="translate(370, 170)">
    <use href="#hexShape" fill="url(#hexGrad1)" stroke="#FFD43B" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1.6s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#FFD43B" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">Python</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Flask</text>
  </g>

  <!-- Hex 17: SQL -->
  <g transform="translate(445, 170)">
    <use href="#hexShape" fill="url(#hexGrad2)" stroke="#00758F" stroke-width="1.5" filter="url(#hexGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="1.9s"/>
    </use>
    <text x="30" y="32" text-anchor="middle" fill="#00758F" font-family="system-ui" font-size="8" font-weight="600" filter="url(#textGlow)">SQL</text>
    <text x="30" y="44" text-anchor="middle" fill="#8892b0" font-family="system-ui" font-size="7">Server</text>
  </g>

  <!-- Connecting lines (subtle) -->
  <g stroke="#00d4ff" stroke-opacity="0.1" stroke-width="1">
    <line x1="130" y1="75" x2="130" y2="105"/>
    <line x1="205" y1="75" x2="205" y2="105"/>
    <line x1="280" y1="75" x2="280" y2="105"/>
    <line x1="355" y1="75" x2="355" y2="105"/>
    <line x1="430" y1="75" x2="430" y2="105"/>
  </g>

  <!-- Floating particles -->
  <circle cx="50" cy="50" r="1" fill="#00d4ff">
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;250;50" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="250" r="1.2" fill="#00ffff">
    <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="250;50;250" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>