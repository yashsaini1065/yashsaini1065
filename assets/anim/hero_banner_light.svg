<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6F9FC"/>
      <stop offset="50%" stop-color="#ECF4FF"/>
      <stop offset="100%" stop-color="#F6F9FC"/>
      <animate attributeName="x1" dur="4s" values="0%;-20%;0%" repeatCount="indefinite"/>
      <animate attributeName="x2" dur="4s" values="100%;120%;100%" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFEA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3AA9FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3AA9FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00BFEA" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="twinkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2B4A6B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2B4A6B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <path fill="url(#wave1)">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="
      M0,210 C200,170 420,250 600,210 C780,170 1000,260 1200,220 L1200,320 L0,320 Z;
      M0,220 C220,260 420,170 600,220 C780,270 980,180 1200,230 L1200,320 L0,320 Z;
      M0,210 C200,170 420,250 600,210 C780,170 1000,260 1200,220 L1200,320 L0,320 Z
    "/>
  </path>

  <path fill="url(#wave2)">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="
      M0,240 C220,210 420,280 600,245 C780,210 980,290 1200,250 L1200,320 L0,320 Z;
      M0,250 C200,290 430,210 600,255 C770,300 980,220 1200,260 L1200,320 L0,320 Z;
      M0,240 C220,210 420,280 600,245 C780,210 980,290 1200,250 L1200,320 L0,320 Z
    "/>
  </path>

  <g fill="url(#twinkle)">
    <circle cx="120" cy="80" r="2.5">
      <animate attributeName="r" values="2;3;2" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="60" r="1.8">
      <animate attributeName="r" values="1.6;2.4;1.6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="90" r="2.2">
      <animate attributeName="r" values="2;3.2;2" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="70" r="2.0">
      <animate attributeName="r" values="1.8;2.8;1.8" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="95" r="2.4">
      <animate attributeName="r" values="2.2;3.4;2.2" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="60" r="1.6">
      <animate attributeName="r" values="1.4;2.2;1.4" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.5;0.18" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
