<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B111B"/>
      <stop offset="50%" stop-color="#0D1626"/>
      <stop offset="100%" stop-color="#0B111B"/>
      <animate attributeName="x1" dur="4s" values="0%;-20%;0%" repeatCount="indefinite"/>
      <animate attributeName="x2" dur="4s" values="100%;120%;100%" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4CC9FF" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <path fill="url(#wave)">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="
      M0,90 C180,70 420,120 600,90 C780,60 1000,120 1200,95 L1200,200 L0,200 Z;
      M0,95 C200,125 420,70 600,100 C780,130 980,80 1200,105 L1200,200 L0,200 Z;
      M0,90 C180,70 420,120 600,90 C780,60 1000,120 1200,95 L1200,200 L0,200 Z
    "/>
  </path>
</svg>
