<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="footerGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="footerGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="footerGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0099cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="100" fill="#0a0a0f"/>

  <!-- Wave Layer 1 - Back (slowest) -->
  <path fill="url(#footerGrad3)" opacity="0.7">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" values="
      M0,40 C100,20 200,50 300,35 C400,20 500,50 600,35 C700,20 800,40 800,40 L800,100 L0,100 Z;
      M0,35 C100,50 200,20 300,40 C400,50 500,20 600,40 C700,50 800,35 800,35 L800,100 L0,100 Z;
      M0,40 C100,20 200,50 300,35 C400,20 500,50 600,35 C700,20 800,40 800,40 L800,100 L0,100 Z"/>
  </path>

  <!-- Wave Layer 2 - Middle -->
  <path fill="url(#footerGrad2)" opacity="0.6">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="
      M0,50 C150,35 250,60 400,45 C550,30 650,55 800,50 L800,100 L0,100 Z;
      M0,45 C150,60 250,35 400,50 C550,60 650,40 800,45 L800,100 L0,100 Z;
      M0,50 C150,35 250,60 400,45 C550,30 650,55 800,50 L800,100 L0,100 Z"/>
  </path>

  <!-- Wave Layer 3 - Front (fastest) -->
  <path fill="url(#footerGrad1)" opacity="0.8">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
      M0,60 C80,50 160,70 240,60 C320,50 400,70 480,60 C560,50 640,70 720,60 C760,55 800,60 800,60 L800,100 L0,100 Z;
      M0,60 C80,70 160,50 240,60 C320,70 400,50 480,60 C560,70 640,50 720,60 C760,65 800,60 800,60 L800,100 L0,100 Z;
      M0,60 C80,50 160,70 240,60 C320,50 400,70 480,60 C560,50 640,70 720,60 C760,55 800,60 800,60 L800,100 L0,100 Z"/>
  </path>

  <!-- Subtle sparkles on wave crests -->
  <circle cx="150" cy="45" r="1" fill="#00ffff">
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="50" r="1.2" fill="#00d4ff">
    <animate attributeName="opacity" values="0;0.7;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="650" cy="48" r="1" fill="#00ffff">
    <animate attributeName="opacity" values="0;0.75;0" dur="2.2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Bottom gradient fade -->
  <rect y="80" width="800" height="20" fill="url(#footerGrad1)" opacity="0.5"/>
</svg>