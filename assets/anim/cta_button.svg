<svg xmlns="http://www.w3.org/2000/svg" width="360" height="90" viewBox="0 0 360 90">
  <defs>
    <linearGradient id="cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4CC9FF"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="340" height="70" rx="16" fill="#0B111B" opacity="0.85" stroke="url(#cta)" stroke-width="1.5"/>

  <rect x="8" y="8" width="344" height="74" rx="18" fill="none" stroke="url(#cta)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;3.5;2" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <text x="180" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E8FBFF" letter-spacing="0.5">Let&#39;s Connect</text>
</svg>
