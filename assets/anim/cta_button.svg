<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="ctaGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-50%;150%" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="ctaGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background fill -->
  <rect x="3" y="3" width="194" height="44" rx="8" fill="#0a0a0f"/>

  <!-- Static border -->
  <rect x="3" y="3" width="194" height="44" rx="8" fill="none" stroke="url(#ctaGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Animated glow border -->
  <rect x="3" y="3" width="194" height="44" rx="8" fill="none" stroke="url(#ctaGlowGrad)" stroke-width="2" filter="url(#ctaGlow)"/>

  <!-- Breathing glow effect -->
  <rect x="3" y="3" width="194" height="44" rx="8" fill="none" stroke="#00d4ff" stroke-width="1" filter="url(#ctaGlow)">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Text -->
  <text x="100" y="30" text-anchor="middle" fill="#00d4ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    Let's Connect
    <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Corner accents -->
  <circle cx="15" cy="15" r="2" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="35" r="2" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>