<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50" width="40" height="50">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <filter id="arrowGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#arrowGlow)">
    <!-- Arrow body -->
    <path d="M20,5 L20,35" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,5;0,0" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </path>

    <!-- Arrow head -->
    <path d="M10,30 L20,42 L30,30" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,5;0,0" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </path>
  </g>

  <!-- Subtle pulse rings -->
  <circle cx="20" cy="42" r="5" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0">
    <animate attributeName="r" values="5;15" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.5;0" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,5;0,0" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
</svg>