<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 8" width="200" height="8">
  <defs>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00ffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="baseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sweepGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base line -->
  <line x1="0" y1="4" x2="200" y2="4" stroke="url(#baseLineGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Animated sweep -->
  <line x1="0" y1="4" x2="200" y2="4" stroke="url(#sweepGrad)" stroke-width="3" stroke-linecap="round" filter="url(#sweepGlow)"/>
</svg>