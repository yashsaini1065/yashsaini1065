<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" preserveAspectRatio="none">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECF4FF"/>
      <stop offset="50%" stop-color="#00BFEA"/>
      <stop offset="100%" stop-color="#ECF4FF"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFEA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00BFEA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00BFEA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="19" width="1200" height="2" fill="url(#line)" opacity="0.55"/>

  <rect x="0" y="18" width="200" height="4" fill="url(#pulse)" opacity="0.8">
    <animate attributeName="x" dur="3.2s" values="-200;1200" repeatCount="indefinite"/>
  </rect>

  <circle cx="600" cy="20" r="5" fill="#00BFEA" opacity="0.2">
    <animate attributeName="r" values="4;7;4" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.35;0.12" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
