<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#21a1f1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#68A063"/>
      <stop offset="100%" stop-color="#3C873A"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#235A97"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512BD4"/>
      <stop offset="100%" stop-color="#68217A"/>
    </linearGradient>
    <linearGradient id="bar6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DD0031"/>
      <stop offset="100%" stop-color="#C3002F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barClip1"><rect x="100" y="22" width="252" height="16" rx="8"/></clipPath>
    <clipPath id="barClip2"><rect x="100" y="67" width="234" height="16" rx="8"/></clipPath>
    <clipPath id="barClip3"><rect x="100" y="112" width="243" height="16" rx="8"/></clipPath>
    <clipPath id="barClip4"><rect x="100" y="157" width="225" height="16" rx="8"/></clipPath>
    <clipPath id="barClip5"><rect x="100" y="202" width="216" height="16" rx="8"/></clipPath>
    <clipPath id="barClip6"><rect x="100" y="247" width="207" height="16" rx="8"/></clipPath>
    <filter id="barGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#0a0a0f"/>

  <!-- Skill 1: JavaScript - 90% -->
  <text x="15" y="34" fill="#F7DF1E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">JavaScript</text>
  <rect x="100" y="22" width="280" height="16" rx="8" fill="url(#barBg)"/>
  <rect x="100" y="22" width="0" height="16" rx="8" fill="url(#bar1)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="252" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <g clip-path="url(#barClip1)">
    <rect x="-100" y="22" width="100" height="16" fill="url(#shine)">
      <animate attributeName="x" values="-100;400" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
  </g>
  <text x="385" y="34" fill="#00d4ff" font-family="system-ui" font-size="11" text-anchor="end" opacity="0">
    90%
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.2s"/>
  </text>

  <!-- Skill 2: React - 85% -->
  <text x="15" y="79" fill="#61DAFB" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">React</text>
  <rect x="100" y="67" width="280" height="16" rx="8" fill="url(#barBg)"/>
  <rect x="100" y="67" width="0" height="16" rx="8" fill="url(#bar2)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="238" dur="1.5s" fill="freeze" begin="0.2s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <g clip-path="url(#barClip2)">
    <rect x="-100" y="67" width="100" height="16" fill="url(#shine)">
      <animate attributeName="x" values="-100;400" dur="2s" repeatCount="indefinite" begin="1.7s"/>
    </rect>
  </g>
  <text x="385" y="79" fill="#61DAFB" font-family="system-ui" font-size="11" text-anchor="end" opacity="0">
    85%
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.4s"/>
  </text>

  <!-- Skill 3: Node.js - 87% -->
  <text x="15" y="124" fill="#68A063" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Node.js</text>
  <rect x="100" y="112" width="280" height="16" rx="8" fill="url(#barBg)"/>
  <rect x="100" y="112" width="0" height="16" rx="8" fill="url(#bar3)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="243" dur="1.5s" fill="freeze" begin="0.4s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <g clip-path="url(#barClip3)">
    <rect x="-100" y="112" width="100" height="16" fill="url(#shine)">
      <animate attributeName="x" values="-100;400" dur="2s" repeatCount="indefinite" begin="1.9s"/>
    </rect>
  </g>
  <text x="385" y="124" fill="#68A063" font-family="system-ui" font-size="11" text-anchor="end" opacity="0">
    87%
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.6s"/>
  </text>

  <!-- Skill 4: TypeScript - 80% -->
  <text x="15" y="169" fill="#3178C6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">TypeScript</text>
  <rect x="100" y="157" width="280" height="16" rx="8" fill="url(#barBg)"/>
  <rect x="100" y="157" width="0" height="16" rx="8" fill="url(#bar4)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="224" dur="1.5s" fill="freeze" begin="0.6s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <g clip-path="url(#barClip4)">
    <rect x="-100" y="157" width="100" height="16" fill="url(#shine)">
      <animate attributeName="x" values="-100;400" dur="2s" repeatCount="indefinite" begin="2.1s"/>
    </rect>
  </g>
  <text x="385" y="169" fill="#3178C6" font-family="system-ui" font-size="11" text-anchor="end" opacity="0">
    80%
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.8s"/>
  </text>

  <!-- Skill 5: .NET Core - 77% -->
  <text x="15" y="214" fill="#512BD4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">.NET Core</text>
  <rect x="100" y="202" width="280" height="16" rx="8" fill="url(#barBg)"/>
  <rect x="100" y="202" width="0" height="16" rx="8" fill="url(#bar5)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="215" dur="1.5s" fill="freeze" begin="0.8s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <g clip-path="url(#barClip5)">
    <rect x="-100" y="202" width="100" height="16" fill="url(#shine)">
      <animate attributeName="x" values="-100;400" dur="2s" repeatCount="indefinite" begin="2.3s"/>
    </rect>
  </g>
  <text x="385" y="214" fill="#512BD4" font-family="system-ui" font-size="11" text-anchor="end" opacity="0">
    77%
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2s"/>
  </text>

  <!-- Skill 6: Angular - 74% -->
  <text x="15" y="259" fill="#DD0031" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Angular</text>
  <rect x="100" y="247" width="280" height="16" rx="8" fill="url(#barBg)"/>
  <rect x="100" y="247" width="0" height="16" rx="8" fill="url(#bar6)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="207" dur="1.5s" fill="freeze" begin="1s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <g clip-path="url(#barClip6)">
    <rect x="-100" y="247" width="100" height="16" fill="url(#shine)">
      <animate attributeName="x" values="-100;400" dur="2s" repeatCount="indefinite" begin="2.5s"/>
    </rect>
  </g>
  <text x="385" y="259" fill="#DD0031" font-family="system-ui" font-size="11" text-anchor="end" opacity="0">
    74%
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.2s"/>
  </text>
</svg>